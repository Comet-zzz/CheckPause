# CheckPause API server.
#
# There is no domain name yet, so this is the default server on port 80: every
# request that arrives is handed to the app listening on 127.0.0.1:8000.
# Once a domain exists, replace `server_name _` with it and add TLS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # A full game plus per-move engine data can be a few megabytes.
    client_max_body_size 20m;

    # The client asks for updates here first: this machine is fast from
    # mainland China and the file is read straight from disk, so there is no
    # CDN cache to go stale. checkpause-version-refresh.timer keeps it current.
    # While the file does not exist this answers 404 and the client falls back
    # to the GitHub mirrors, which is the intended behaviour.
    location = /version.json {
        root /srv/downloads;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Release installers, as a mirror. GitHub is slow to download from inside
    # China and the installer is over a hundred megabytes, which is long enough
    # that people give up and never come back. The same file is served from
    # here instead, from the machine that is already paid for.
    location /download/ {
        alias /srv/downloads/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Streaming replies must not be buffered, otherwise the client only
        # sees the answer after it is completely finished.
        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# CheckPause API server, plain HTTP.
#
# The app listens only on 127.0.0.1:8000. This block stays the default server
# on port 80 so the IP mirror (http://43.108.99.244/version.json and
# /download/) keeps working for clients still pointing at the bare address;
# the checkpause.com names are served here too, and an HTTPS block
# (checkpause-tls.conf) is layered on once a certificate exists.
#
# Do NOT blanket-redirect port 80 to HTTPS: the update mirror is plain HTTP on
# the IP, and redirecting it to a certificate that only covers the domain would
# break update checks for every installed client.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name checkpause.com www.checkpause.com _;

    # Let's Encrypt HTTP-01 challenge. It has to answer over plain HTTP before
    # any certificate exists, and renewal depends on it, so it lives here rather
    # than in the shared snippet.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include snippets/checkpause-locations.conf;
}

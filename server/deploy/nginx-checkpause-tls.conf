# CheckPause API server over HTTPS.
#
# install.sh installs this block only when a certificate for checkpause.com
# already exists, so a first deploy on a machine where certbot has not run yet
# still passes `nginx -t`. Issuing the certificate is a one-off (see the TLS
# note in server/README.md); every later deploy re-enables this block.
#
# The certificate is issued and renewed by certbot, so the paths below are the
# fixed Let's Encrypt ones.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name checkpause.com www.checkpause.com;

    ssl_certificate     /etc/letsencrypt/live/checkpause.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkpause.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/checkpause-locations.conf;
}

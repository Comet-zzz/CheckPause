name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Download Stockfish (macOS universal)
        env:
          STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-macos-universal.tar.gz
          STOCKFISH_SHA256: a1f0e3bcc5a6927a11fe6fc8e54a779754645f3c2bae2cf13420fd1957adaa77
        run: |
          set -euo pipefail
          curl -fL -o /tmp/stockfish.tar.gz "$STOCKFISH_URL"
          echo "$STOCKFISH_SHA256  /tmp/stockfish.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/stockfish.tar.gz -C stockfish
          test -f stockfish/stockfish/stockfish-macos-universal
          chmod +x stockfish/stockfish/stockfish-macos-universal

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version="$(python -c "import re,pathlib; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('checkpause/__init__.py').read_text()).group(1))")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: python -m PyInstaller CheckPause.spec --noconfirm

      - name: Verify the engine shipped inside the bundle
        run: |
          set -euo pipefail
          engine="$(find dist/CheckPause.app -name 'stockfish-macos-universal' -type f -print -quit)"
          if [ -z "$engine" ]; then
            echo "Stockfish is missing from the .app bundle" >&2
            exit 1
          fi
          echo "engine: $engine"

      - name: Ad-hoc sign the bundle
        run: |
          set -euo pipefail
          app="dist/CheckPause.app"
          engine="$(find "$app" -name 'stockfish-macos-universal' -type f -print -quit)"
          chmod +x "$engine"
          codesign --force --sign - "$engine"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Build DMG
        id: dmg
        run: |
          set -euo pipefail
          name="CheckPause-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}"
          stage="$(mktemp -d)"
          cp -R dist/CheckPause.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname CheckPause -srcfolder "$stage" -ov -format UDZO "dist/${name}.dmg"
          echo "path=dist/${name}.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckPause-macos-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub release (only if one already exists)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.dmg.outputs.path }}" --clobber
          else
            echo "No release for $tag yet; download the workflow artifact instead."
          fi
